name: Codex Cloud Research

on:
  schedule:
    - cron: "2 * * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Run even when open PRs or active queue issues exist"
        required: false
        default: false
        type: boolean

permissions:
  actions: write
  contents: read
  issues: write
  pull-requests: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  CODEX_ACTION_MODEL: ${{ vars.CODEX_ACTION_MODEL || 'gpt-5.2-codex' }}
  CODEX_ACTION_EFFORT: ${{ vars.CODEX_ACTION_EFFORT || 'xhigh' }}
  OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

concurrency:
  group: codex-cloud-research
  cancel-in-progress: true

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Gate cloud research
        id: gate
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        with:
          result-encoding: string
          script: |
            const { owner, repo } = context.repo;
            const force = context.payload.inputs?.force === "true" || context.payload.inputs?.force === true;
            const allowedActors = new Set(["onfire7777", "github-actions[bot]"]);
            const finish = (decision) => {
              core.notice(`Codex Cloud Research gate: ${decision.reason}`);
              return JSON.stringify(decision);
            };

            if (context.eventName === "workflow_dispatch" && !allowedActors.has(context.actor)) {
              return finish({
                run: false,
                reason: `skipped: actor=${context.actor} is not allowed to run openai/codex-action`
              });
            }

            const openPrs = await github.paginate(github.rest.pulls.list, {
              owner,
              repo,
              state: "open",
              per_page: 100
            });
            const isDependencyPr = (pr) => {
              const author = pr.user?.login || "";
              const headRef = pr.head?.ref || "";
              const labels = (pr.labels || []).map((label) => label.name || label);
              return (
                author.toLowerCase().includes("dependabot") ||
                headRef.startsWith("dependabot/") ||
                labels.includes("dependencies")
              );
            };
            const dependencyPrs = openPrs.filter(isDependencyPr);
            const blockingOpenPrs = openPrs.filter((pr) => !isDependencyPr(pr));
            const openIssuesRaw = await github.paginate(github.rest.issues.listForRepo, {
              owner,
              repo,
              state: "open",
              per_page: 100
            });
            const openIssues = openIssuesRaw.filter((issue) => !issue.pull_request);
            const globalStop = openIssues.find((issue) => {
              const labels = issue.labels.map((label) => label.name);
              return (
                issue.title.startsWith("[Codex Health]") &&
                labels.includes("agent:blocked") &&
                labels.includes("blocker:global-stop")
              );
            });
            if (globalStop && !force) {
              return finish({
                run: false,
                reason: `skipped: global stop issue #${globalStop.number}: ${globalStop.title}`
              });
            }
            const activeQueueIssues = openIssuesRaw
              .filter((issue) => !issue.pull_request)
              .filter((issue) =>
                issue.labels.some((label) =>
                  ["agent:queued", "agent:claimed", "agent:running", "agent:merge-gate"].includes(label.name)
                )
              );

            if (!force && (blockingOpenPrs.length || activeQueueIssues.length)) {
              return finish({
                run: false,
                reason: `skipped: blockingOpenPrs=${blockingOpenPrs.length}, dependencyPrs=${dependencyPrs.length}, activeQueueIssues=${activeQueueIssues.length}`
              });
            }

            return finish({ run: true, reason: "cloud research eligible" });

      - name: Checkout
        if: contains(steps.gate.outputs.result, '"run":true')
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Prepare GitHub context
        if: contains(steps.gate.outputs.result, '"run":true')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "# Codex Cloud R&D Context"
            echo
            echo "Repository: $GITHUB_REPOSITORY"
            echo "Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo
            echo "## Open PRs"
            gh pr list --json number,title,headRefName,isDraft,mergeStateStatus,reviewDecision,labels
            echo
            echo "## Open Issues"
            gh issue list --state open --json number,title,labels
            echo
            echo "## Recent Runs"
            gh run list --limit 10 --json databaseId,workflowName,headBranch,status,conclusion,event,createdAt
          } > codex-cloud-context.md

      - name: Report missing OPENAI_API_KEY
        if: contains(steps.gate.outputs.result, '"run":true') && env.OPENAI_API_KEY == ''
        run: |
          {
            echo "## Codex Cloud Research"
            echo
            echo "Skipped because repository secret OPENAI_API_KEY is not configured."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Run Codex cloud research
        id: run_codex
        if: contains(steps.gate.outputs.result, '"run":true') && env.OPENAI_API_KEY != ''
        uses: openai/codex-action@e0fdf01220eb9a88167c4898839d273e3f2609d1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          model: ${{ env.CODEX_ACTION_MODEL }}
          effort: ${{ env.CODEX_ACTION_EFFORT }}
          codex-args: '--enable fast_mode --config model_verbosity="medium"'
          sandbox: read-only
          safety-strategy: drop-sudo
          allow-users: onfire7777
          allow-bots: true
          output-file: codex-output.md
          prompt: |
            You are Stage 0 R&D for onfire7777/five-agent-dev-team.

            Read docs/implementation-spec.md first, then .github/ISSUE_TEMPLATE/codex_queue_item.yml, codex-cloud-context.md, README.md, docs/**, and tests as needed.
            Produce at most one GitHub issue-ready queue item.
            Do not edit files, propose dependencies, merge, push, or mark acceptance complete.
            Only propose work that maps to the implementation spec and real product behavior, and can run in codex-cloud, codex-action, or agentic-workflow.
            When no PR or active queue issue exists, prefer producing the next bounded implementation slice from docs/implementation-spec.md.
            Choose the lane from the expected file ownership, not from the broad topic:
            - backend: apps/controller/**, apps/worker/**, packages/shared/**, packages/github/**, packages/agents/src/**, backend/schema/store/controller/agent/plugin/release tests.
            - frontend: apps/dashboard/** and dashboard e2e coverage.
            - quality: tests/**, Playwright config, test utilities, reproductions, and acceptance evidence only.
            - security: .github/**, CI workflows, Dockerfile, docker-compose.yml, .env.example, package*.json, audit/security/check scripts, release/**, auth/security/permission work.
            - docs: README.md, docs/**, release notes, runbooks, and acceptance docs.
            If Expected files include .github/** or CI workflow changes, Lane assignment must be security.
            If no non-overlapping product-spec-backed work scores at least 22/30, output exactly:
            QUEUE_ITEM_READY: no

            If a queue item is valid, output exactly this field set:
            QUEUE_ITEM_READY: yes
            Title: <short title>
            Problem: <problem>
            Hypothesis: <hypothesis>
            Product-spec mapping: <specific docs/implementation-spec.md section, README/docs surface, or acceptance behavior>
            Expected files: <file globs>
            Non-overlap check: <why it does not collide with open work>
            Acceptance criteria: <bulleted criteria>
            Verification commands: <commands>
            Risk class: <low|medium|high>
            Diff budget: <files and lines>
            Rollback plan: <plan>
            Lane assignment: <backend|frontend|quality|security|docs>
            Execution target: <codex-cloud|codex-action|agentic-workflow>
            Score: <22-30>/30

      - name: Pause pipeline on Codex provider failure
        if: failure() && steps.run_codex.outcome == 'failure'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        with:
          script: |
            const { owner, repo } = context.repo;
            const healthTitle = "[Codex Health] Cloud control-plane finding";
            const runUrl = `${process.env.GITHUB_SERVER_URL}/${owner}/${repo}/actions/runs/${context.runId}`;
            const body = [
              "# Codex Cloud Meta Health",
              "",
              `Observed: ${new Date().toISOString()}`,
              `Repository: ${owner}/${repo}`,
              "",
              "## Blockers",
              "- globalStop: Codex provider call failed during Stage 0 R&D.",
              "",
              "## Evidence",
              `- Workflow: Codex Cloud Research`,
              `- Run: ${runUrl}`,
              "- The Codex action failed before producing a valid queue item. Treat this as an OpenAI provider/auth/quota issue until a forced research run succeeds.",
              "",
              "## Required action",
              "- Verify OPENAI_API_KEY, OpenAI project billing, project limits, and model access.",
              "- After fixing credentials or quota, run Codex Cloud Research manually with force=true, then run Meta Health to clear this pause.",
              "",
              "## Routing",
              "Cloud build lanes should remain paused by this global stop issue."
            ].join("\n");
            const openIssuesRaw = await github.paginate(github.rest.issues.listForRepo, {
              owner,
              repo,
              state: "open",
              per_page: 100
            });
            const healthIssue = openIssuesRaw.find((issue) => !issue.pull_request && issue.title === healthTitle);
            const labels = ["agent:blocked", "blocker:global-stop"];
            if (healthIssue) {
              await github.rest.issues.update({
                owner,
                repo,
                issue_number: healthIssue.number,
                body,
                labels
              });
            } else {
              await github.rest.issues.create({
                owner,
                repo,
                title: healthTitle,
                body,
                labels
              });
            }
            core.setFailed("Codex provider failure paused cloud automation.");

      - name: Create or refresh queue issue
        id: queue_issue
        if: steps.run_codex.outputs.final-message != ''
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        env:
          CODEX_FINAL_MESSAGE: ${{ steps.run_codex.outputs.final-message }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const output = process.env.CODEX_FINAL_MESSAGE || "";
            await core.summary.addRaw(`## Codex Cloud Research Output\n\n${output}`).write();

            if (!/^QUEUE_ITEM_READY:\s*yes\s*$/im.test(output)) {
              core.setOutput("queue_ready", "false");
              core.notice("Codex did not produce a queue item.");
              return;
            }

            const requiredFields = [
              "Title",
              "Problem",
              "Hypothesis",
              "Product-spec mapping",
              "Expected files",
              "Non-overlap check",
              "Acceptance criteria",
              "Verification commands",
              "Risk class",
              "Diff budget",
              "Rollback plan",
              "Lane assignment",
              "Execution target",
              "Score"
            ];
            const missing = requiredFields.filter((field) => !new RegExp(`^${field}:`, "im").test(output));
            if (missing.length) {
              core.setFailed(`Codex output is missing required fields: ${missing.join(", ")}`);
              return;
            }

            const scoreMatch = output.match(/^Score:\s*(\d+)\s*\/\s*30\s*$/im);
            const score = scoreMatch ? Number(scoreMatch[1]) : 0;
            if (score < 22 || score > 30) {
              core.setFailed(`Codex output has invalid score: ${score || "missing"}`);
              return;
            }

            const title = (output.match(/^Title:\s*(.+)$/im)?.[1] || "").trim();
            const lane = (output.match(/^Lane assignment:\s*(backend|frontend|quality|security|docs)\s*$/im)?.[1] || "").trim();
            const execution = (
              output.match(/^Execution target:\s*(codex-cloud|codex-action|agentic-workflow)\s*$/im)?.[1] || ""
            ).trim();

            if (!title || !lane || !execution) {
              core.setFailed("Codex output has invalid title, lane, or cloud execution target.");
              return;
            }

            const issueTitle = title.startsWith("[Codex Queue]") ? title : `[Codex Queue] ${title}`;
            const labels = ["agent:queued", `lane:${lane}`, `execution:${execution}`, "priority:p2"];
            const body = [
              "Created by Codex Cloud Research.",
              "",
              `Source run: ${process.env.GITHUB_SERVER_URL}/${owner}/${repo}/actions/runs/${context.runId}`,
              "",
              output
            ].join("\n");

            const openIssuesRaw = await github.paginate(github.rest.issues.listForRepo, {
              owner,
              repo,
              state: "open",
              per_page: 100
            });
            const existing = openIssuesRaw.find((issue) => !issue.pull_request && issue.title === issueTitle);

            if (existing) {
              await github.rest.issues.update({
                owner,
                repo,
                issue_number: existing.number,
                body,
                labels
              });
              core.setOutput("queue_ready", "true");
              core.setOutput("issue_number", String(existing.number));
              core.setOutput("lane", lane);
              return;
            }

            const created = await github.rest.issues.create({
              owner,
              repo,
              title: issueTitle,
              body,
              labels
            });
            core.setOutput("queue_ready", "true");
            core.setOutput("issue_number", String(created.data.number));
            core.setOutput("lane", lane);

      - name: Clear provider global stop after successful forced research
        if: always() && steps.run_codex.outcome == 'success' && (github.event.inputs.force == 'true' || github.event.inputs.force == true)
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        with:
          script: |
            const { owner, repo } = context.repo;
            const healthTitle = "[Codex Health] Cloud control-plane finding";
            const runUrl = `${process.env.GITHUB_SERVER_URL}/${owner}/${repo}/actions/runs/${context.runId}`;
            const openIssuesRaw = await github.paginate(github.rest.issues.listForRepo, {
              owner,
              repo,
              state: "open",
              per_page: 100
            });
            const healthIssues = openIssuesRaw
              .filter((issue) => !issue.pull_request && issue.title === healthTitle);

            for (const issue of healthIssues) {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: issue.number,
                body: `Codex Cloud Research completed successfully with force=true, so the provider/auth/quota global stop is verified clear.\n\nRun: ${runUrl}`
              });
              await github.rest.issues.update({
                owner,
                repo,
                issue_number: issue.number,
                state: "closed",
                state_reason: "completed"
              });
            }

      - name: Dispatch build for queued issue
        if: steps.queue_issue.outputs.queue_ready == 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        with:
          script: |
            const { owner, repo } = context.repo;
            const lane = "${{ steps.queue_issue.outputs.lane }}";
            const issueNumber = "${{ steps.queue_issue.outputs.issue_number }}";
            await github.rest.actions.createWorkflowDispatch({
              owner,
              repo,
              workflow_id: "codex-cloud-build-pipeline.yml",
              ref: "main",
              inputs: {
                stage: lane,
                force: "false"
              }
            });
            core.notice(`Dispatched Codex Cloud Build Pipeline for issue #${issueNumber} lane=${lane}`);

      - name: Upload Codex research output
        if: always() && contains(steps.gate.outputs.result, '"run":true')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: codex-cloud-research
          path: |
            codex-output.md
            codex-cloud-context.md
          if-no-files-found: ignore
